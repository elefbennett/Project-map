<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SYV Projects Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" />

  <style>
    :root { --color-primary: #722f37; --color-border: #e8e2d9; --color-surface: #ffffff; --color-bg: #f9f8f6; }
    body { margin:0; font-family:'Lato',sans-serif; background:var(--color-bg); color:#333; padding:20px 0; }
    main { max-width:1400px; margin:0 auto; }

    #map { height:80vh; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.12); position:relative; border:1px solid var(--color-border); }

    #mapOverlay { position:absolute; inset:0; background:rgba(255,255,255,0.95); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:1.4rem; }
    .spinner { width:56px; height:56px; border:6px solid #f3f3f3; border-top:6px solid var(--color-primary); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    #topControls { position:absolute; top:16px; left:16px; z-index:1000; display:flex; gap:12px; flex-wrap:wrap; }
    .btn { background:rgba(255,255,255,0.94); padding:12px 20px; border:none; border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,0.2); font-weight:600; cursor:pointer; }
    .btn:hover { transform:translateY(-2px); }

    #filters { margin:30px auto; padding:32px; background:var(--color-surface); border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.08); border:1px solid var(--color-border); display:grid; gap:28px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); transition:transform .4s; }
    #filters.collapsed { transform:translateY(-110%); }
    #filters h3 { margin:0 0 12px; color:var(--color-primary); font-size:1.5rem; }

    #searchBox { padding:14px 16px; border:1px solid var(--color-border); border-radius:12px; font-size:1.1rem; }
    #searchBox:focus { outline:none; border-color:var(--color-primary); box-shadow:0 0 0 4px rgba(114,47,55,0.15); }

    .ts-control { padding:14px 16px !important; border:1px solid var(--color-border) !important; border-radius:12px !important; background:white !important; min-height:56px; font-size:1.1rem; }
    .ts-dropdown { border-radius:12px !important; box-shadow:0 10px 30px rgba(0,0,0,0.12) !important; margin-top:8px; }
    .ts-dropdown .option.active { background:var(--color-primary) !important; color:white !important; }
    .item { background:var(--color-primary) !important; color:white !important; border-radius:20px !important; padding:6px 12px !important; }

    .legend { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding-top:12px; border-top:1px solid var(--color-border); }
    .legend-item { display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 12px; border-radius:8px; transition:background .2s; }
    .legend-item:hover { background:#f5f0eb; }
    .legend-item .swatch { width:16px; height:16px; border-radius:50%; border:2px solid #999; }

    .result-count { font-weight:600; font-size:1.2rem; color:var(--color-primary); text-align:center; }

    body.dark { background:#121212 !important; color:#eee !important; }
    body.dark #filters { background:#1e1e1e !important; border-color:#444 !important; }
    body.dark .ts-control, body.dark #searchBox { background:#333 !important; color:#eee !important; border-color:#555 !important; }

    @media (max-width:768px) { #filters { padding:24px; margin:16px; grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <div id="map">
      <div id="mapOverlay"><div class="spinner"></div><div>Loading projects...</div></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpgk.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

  <script>
    const REAL_CSV = 'https://corsproxy.io/?https://docs.google.com/spreadsheets/d/1fUKAQlPWiotRlFQw95qbvUjvxwNFJGWWT3RX6OcCKRI/export?format=csv';
    const COLORS = ['red','blue','green','orange','yellow','violet','grey','black'];
    const colorMap = {};
    let map, cluster, projects = [], tomSelect = null;

    // Fallback data so the map NEVER stays stuck
    const FALLBACK_PROJECTS = [
      { "Job Name": "Napa Valley Vineyard", "Work Type": "Trellis Installation", "Street Address": "123 Vineyard Lane", "City": "Napa", "State": "CA", "Latitude": "38.5", "Longitude": "-122.4" },
      { "Job Name": "Sonoma Estate", "Work Type": "Irrigation System", "Street Address": "456 Wine Road", "City": "Sonoma", "State": "CA", "Latitude": "38.3", "Longitude": "-122.5" },
      { "Job Name": "Santa Ynez Ranch", "Work Type": "Slope Stabilization", "Street Address": "789 Hilltop Drive", "City": "Santa Ynez", "State": "CA", "Latitude": "34.6", "Longitude": "-120.1" }
    ];

    async function loadRealData() {
      try {
        const r = await fetch(REAL_CSV + '&t=' + Date.now(), {cache:'no-store'});
        if (!r.ok) throw new Error('Bad response');
        const text = await r.text();
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('Empty');
        const headers = lines[0].split(',').map(h=>h.trim());
        return lines.slice(1).map(l => {
          const vals = l.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
          const o = {};
          headers.forEach((h,i) => o[h] = vals[i] || '');
          return o;
        });
      } catch(e) {
        console.log('Real data failed, using fallback');
        return FALLBACK_PROJECTS;
      }
    }

    function buildFilters(workTypes) {
      document.querySelector('main').insertAdjacentHTML('beforeend', `
        <section id="filters">
          <div class="filter-group">
            <h3>🔍 Search Projects</h3>
            <input type="text" id="searchBox" placeholder="Job name, city, address..." />
          </div>
          <div class="filter-group">
            <h3>Work Type</h3>
            <select id="workTypeSelect" multiple placeholder="All Work Types"></select>
          </div>
          <div class="filter-actions">
            <button id="resetFilters" class="btn" style="background:#666;color:white;">Reset All</button>
            <span id="resultCount" class="result-count"></span>
          </div>
          <div id="legend" class="legend"><strong>Legend:</strong></div>
        </section>`);

      tomSelect = new TomSelect('#workTypeSelect', {
        plugins: ['remove_button','dropdown_input'],
        create: false,
        options: workTypes.map(w => ({value:w, text:w})),
        render: {
          option: (d,esc) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;"><span style="width:14px;height:14px;border-radius:50%;background:${colorMap[d.value]||'grey'};border:1px solid #999;"></span>${esc(d.text)}</div>`,
          item: (d,esc) => `<div style="background:#722f37;color:white;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:0.9rem;"><span style="width:10px;height:10px;border-radius:50%;background:${colorMap[d.value]||'grey'};"></span>${esc(d.text)}</div>`
        }
      });

      const legend = document.getElementById('legend');
      Object.entries(colorMap).forEach(([type,col]) => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.innerHTML = `<span class="swatch" style="background:${col}"></span>${type}`;
        el.onclick = () => tomSelect.addItem(type);
        legend.appendChild(el);
      });
    }

    async function init() {
      map = L.map('map').setView([37.0, -120.0], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      cluster = L.markerClusterGroup();
      map.addLayer(cluster);

      document.getElementById('map').insertAdjacentHTML('beforeend', `
        <div id="topControls">
          <button id="toggleFilters" class="btn">⚙️ Filters</button>
          <button id="locateMe" class="btn">📍 Near Me</button>
          <button id="darkMode" class="btn">🌙 Dark</button>
        </div>`);

      projects = await loadRealData();  // will use fallback if real fails

      const types = [...new Set(projects.map(p => p['Work Type']).filter(Boolean))].sort();
      types.forEach((t,i) => colorMap[t] = COLORS[i % COLORS.length]);

      buildFilters(types);
      document.getElementById('mapOverlay').remove();
      document.getElementById('resultCount').textContent = `Loaded ${projects.length} projects`;
      plot();

      const live = () => setTimeout(plot, 300);
      document.getElementById('searchBox').addEventListener('input', live);
      tomSelect.on('change', plot);

      document.getElementById('resetFilters').onclick = () => { document.getElementById('searchBox').value = ''; tomSelect.clear(); plot(); };
      document.getElementById('locateMe').onclick = () => map.locate({setView:true,maxZoom:12});
      document.getElementById('toggleFilters').onclick = () => document.getElementById('filters').classList.toggle('collapsed');
      document.getElementById('darkMode').onclick = () => document.body.classList.toggle('dark');
    }

    function plot() {
      cluster.clearLayers();
      const bounds = L.latLngBounds();
      let count = 0;
      const q = document.getElementById('searchBox').value.toLowerCase();
      const sel = tomSelect ? tomSelect.items : [];

      for (const p of projects) {
        if (sel.length && !sel.includes(p['Work Type'])) continue;
        if (q && !Object.values(p).join(' ').toLowerCase().includes(q)) continue;
        const lat = parseFloat(p.Latitude || p.latitude || p.lat);
        const lon = parseFloat(p.Longitude || p.longitude || p.lon);
        if (!lat || !lon) continue;

        const marker = L.marker([lat,lon], {icon: L.icon({
          iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${colorMap[p['Work Type']]||'grey'}.png`,
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize:[25,41], iconAnchor:[12,41], popupAnchor:[1,-34], shadowSize:[41,41]
        })});

        const addr = [p['Street Address'],p.City,p.State,p['Zip Code']].filter(Boolean).join(', ');
        marker.bindPopup(`<div class="project-popup"><strong>${p['Job Name']||'Unnamed'}</strong><br>${addr}<br><br><b>Work Type:</b> ${p['Work Type']||'—'}</div>`);
        cluster.addLayer(marker);
        bounds.extend([lat,lon]);
        count++;
      }
      document.getElementById('resultCount').textContent = count ? `${count} project${count>1?'s':''} shown` : 'No matches';
      if (count) map.fitBounds(bounds.pad(0.2));
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
