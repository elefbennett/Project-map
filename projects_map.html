<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYV Projects Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

  <!-- TomSelect (searchable dropdown) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" />

  <style>
    :root { --primary: #722f37; --border: #e8e2d9; --bg: #f9f8f6; --surface: #fff; }
    body { margin:0; font-family:'Lato',sans-serif; background:var(--bg); padding:20px 0; }
    main { max-width:1400px; margin:0 auto; }
    #map { height:80vh; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.12); position:relative; border:1px solid var(--border); }
    #overlay { position:absolute; inset:0; background:rgba(255,255,255,0.95); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:1.4rem; }
    .spinner { width:56px; height:56px; border:6px solid #f3f3f3; border-top:6px solid var(--primary); border-radius:50%; animation:s 1s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }

    #top { position:absolute; top:16px; left:16px; z-index:1000; display:flex; gap:12px; }
    .btn { background:rgba(255,255,255,0.95); padding:12px 20px; border:none; border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,0.2); font-weight:600; cursor:pointer; }

    #filters { margin:30px auto; padding:32px; background:var(--surface); border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.08); border:1px solid var(--border); display:grid; gap:28px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
    #filters h3 { margin:0 0 12px; color:var(--primary); font-size:1.5rem; }
    #searchBox { padding:14px 16px; border:1px solid var(--border); border-radius:12px; font-size:1.1rem; }
    .ts-control { padding:14px 16px !important; border:1px solid var(--border) !important; border-radius:12px !important; background:white !important; min-height:56px; font-size:1.1rem; }
    .ts-dropdown { border-radius:12px !important; box-shadow:0 10px 30px rgba(0,0,0,0.12) !important; }
    .item { background:var(--primary) !important; color:white !important; border-radius:20px !important; padding:6px 12px !important; }
    .legend { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding-top:12px; border-top:1px solid var(--border); }
    .legend-item { display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 12px; border-radius:8px; }
    .legend-item .swatch { width:16px; height:16px; border-radius:50%; border:2px solid #999; }
    .result-count { text-align:center; font-weight:600 1.2rem var(--primary); }
  </style>
</head>
<body>
  <main>
    <div id="map">
      <div id="overlay"><div class="spinner"></div><div>Loading map...</div></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

  <script>
    // Your Google Sheet (public or via proxy)
    const CSV_URL = 'https://corsproxy.io/?https://docs.google.com/spreadsheets/d/1fUKAQlPWiotRlFQw95qbvUjvxwNFJGWWT3RX6OcCKRI/export?format=csv';

    const COLORS = ['red','blue','green','orange','yellow','violet','grey','black'];
    const colorMap = {};
    let map, cluster, projects = [], tom = null;

    // Guaranteed fallback data (so it never stays stuck)
    const FALLBACK = [
      {"Job Name":"Napa Vineyard","Work Type":"Trellis","Street Address":"123 Vine St","City":"Napa","State":"CA","Latitude":"38.5025","Longitude":"-122.4650"},
      {"Job Name":"Sonoma Hills","Work Type":"Irrigation","Street Address":"456 Oak Rd","City":"Sonoma","State":"CA","Latitude":"38.2919","Longitude":"-122.4580"},
      {"Job Name":"Santa Ynez Ranch","Work Type":"Slope Stabilization","Street Address":"789 Hill Dr","City":"Santa Ynez","State":"CA","Latitude":"34.6100","Longitude":"-120.0800"}
    ];

    async function getData() {
      try {
        const r = await fetch(CSV_URL + '&t=' + Date.now());
        const t = await r.text();
        const lines = t.trim().split('\n');
        const h = lines[0].split(',').map(x=>x.trim());
        return lines.slice(1).map(l => {
          const v = l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
          const o = {};
          h.forEach((k,i)=>o[k]=v[i]||'');
          return o;
        });
      } catch(e) {
        console.log('Using fallback data');
        return FALLBACK;
      }
    }

    async function start() {
      map = L.map('map').setView([36,-119], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      cluster = L.markerClusterGroup();
      map.addLayer(cluster);

      document.getElementById('map').innerHTML += `
        <div id="top">
          <button class="btn" id="toggle">⚙️ Filters</button>
          <button class="btn" id="near">📍 Near Me</button>
          <button class="btn" id="dark">🌙 Dark</button>
        </div>`;

      projects = await getData();

      const types = [...new Set(projects.map(p=>p['Work Type']).filter(Boolean))].sort();
      types.forEach((t,i)=> colorMap[t] = COLORS[i%COLORS.length]);

      // Build filters
      document.querySelector('main').insertAdjacentHTML('beforeend', `
        <section id="filters">
          <div><h3>🔍 Search</h3><input type="text" id="searchBox" placeholder="Job, city..."></div>
          <div><h3>Work Type</h3><select id="workTypeSelect" multiple></select></div>
          <div style="text-align:center"><button id="reset" class="btn" style="background:#666;color:white">Reset</button><div id="count" class="result-count"></div></div>
          <div id="legend" class="legend"><strong>Legend:</strong></div>
        </section>`);

      tom = new TomSelect('#workTypeSelect', {
        plugins: ['remove_button','dropdown_input'],
        create: false,
        options: types.map(t=>({value:t, text:t})),
        render: {
          option: (d,e) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0"><span style="width:14px;height:14px;border-radius:50%;background:${colorMap[d.value]||'grey'};border:1px solid #999"></span>${e(d.text)}</div>`,
          item: (d,e) => `<div style="background:#722f37;color:white;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:0.9rem"><span style="width:10px;height:10px;border-radius:50%;background:${colorMap[d.value]||'grey'}"></span>${e(d.text)}</div>`
        }
      });

      // Legend
      const leg = document.getElementById('legend');
      Object.entries(colorMap).forEach(([t,c]) => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.innerHTML = `<span class="swatch" style="background:${c}"></span>${t}`;
        el.onclick = () => tom.addItem(t);
        leg.appendChild(el);
      });

      document.getElementById('overlay').remove();
      document.getElementById('count').textContent = `${projects.length} projects loaded`;
      plot();

      // Events
      const live = () => setTimeout(plot,300);
      document.getElementById('searchBox').addEventListener('input', live);
      tom.on('change', plot);
      document.getElementById('reset').onclick = () => { document.getElementById('searchBox').value=''; tom.clear(); plot(); };
      document.getElementById('near').onclick = () => map.locate({setView:true,maxZoom:12});
      document.getElementById('toggle').onclick = () => document.getElementById('filters').classList.toggle('collapsed');
      document.getElementById('dark').onclick = () => document.body.classList.toggle('dark');
    }

    function plot() {
      cluster.clearLayers();
      const bounds = L.latLngBounds();
      let count = 0;
      const q = document.getElementById('searchBox').value.toLowerCase();
      const sel = tom ? tom.items : [];

      for (const p of projects) {
        if (sel.length && !sel.includes(p['Work Type'])) continue;
        if (q && !Object.values(p).join(' ').toLowerCase().includes(q)) continue;
        const lat = parseFloat(p.Latitude || p.latitude);
        const lon = parseFloat(p.Longitude || p.longitude);
        if (!lat || !lon) continue;

        const icon = L.icon({
          iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${colorMap[p['Work Type']]||'grey'}.png`,
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25,41], iconAnchor: [12,41], popupAnchor: [1,-34], shadowSize: [41,41]
        });

        const m = L.marker([lat,lon], {icon});
        const addr = [p['Street Address'],p.City,p.State,p['Zip Code']].filter(Boolean).join(', ');
        m.bindPopup(`<strong>${p['Job Name']||'Project'}</strong><br>${addr}<br><b>Work Type:</b> ${p['Work Type']||'—'}`);
        cluster.addLayer(m);
        bounds.extend([lat,lon]);
        count++;
      }
      document.getElementById('count').textContent = count ? `${count} project${count>1?'s':''} shown` : 'No results';
      if (count) map.fitBounds(bounds.pad(0.2));
    }

    document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
