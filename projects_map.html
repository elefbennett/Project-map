<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRS Projects Map - Final Address Details</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" />

  <style>
    :root { --primary: #722f37; --border: #e8e2d9; --bg: #f9f8f6; --surface: #fff; }
    body { margin:0; font-family:'Lato',sans-serif; background:var(--bg); padding:20px 0; }
    main { max-width:1400px; margin:0 auto; padding: 0 20px; }
    #map { height:75vh; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.12); position:relative; border:1px solid var(--border); }
    #loading { position:absolute; inset:0; background:rgba(255,255,255,0.95); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:1.4rem; }
    .spinner { width:56px; height:56px; border:6px solid #f3f3f3; border-top:6px solid var(--primary); border-radius:50%; animation:s 1s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
    #topControls { position:absolute; top:16px; left:16px; z-index:1000; display:flex; gap:12px; flex-wrap:wrap; }
    .btn { background:rgba(255,255,255,0.95); padding:12px 20px; border:none; border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,0.2); font-weight:600; cursor:pointer; }
    #filters { margin:30px auto; padding:32px; background:var(--surface); border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.08); border:1px solid var(--border); display:grid; gap:28px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
    #filters.collapsed { display: none; }
    #filters h3 { margin:0 0 12px; color:var(--primary); font-size:1.5rem; }
    #searchBox { padding:14px 16px; border:1px solid var(--border); border-radius:12px; font-size:1.1rem; width:100%; box-sizing:border-box; }
    .ts-control { padding:14px 16px !important; border-radius:12px !important; }
    #count { text-align:center; font-weight:600; font-size:1.2rem; color:var(--primary); margin-top: 10px; }
    .legend { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding-top:12px; border-top:1px solid var(--border); }
    .legend-item { display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 12px; border-radius:8px; }
    .legend-item .swatch { width:16px; height:16px; border-radius:50%; border:2px solid #999; }
  </style>
</head>
<body>

  <main>
    <div id="map">
      <div id="loading"><div class="spinner"></div><div>Finalizing Map Details...</div></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTB_eYjbWk8gM-dAyY2gNFiJ4k60S3DRpF0AyMIe-8J2FyqiquIyraVjv9yHZ4tuMywAjkqRHV9V5BD/pub?output=csv";
    const TARGET_STAGES = ["4.3 - Closed - Project", "3.3 - Submitted", "3.4 - Permitted", "3.5 - In Construction"];
    const COLORS = ['red', 'blue', 'green', 'orange', 'yellow', 'violet', 'grey', 'black'];

    let map, cluster, projects = [], tomWorkType, tomDealStage;
    const colorMap = {};

    function parseCSV(text) {
      const rows = text.split(/\r?\n/).filter(r => r.trim());
      const rawData = rows.map(row => {
        const result = [];
        let cell = '', inQuotes = false;
        for (let char of row) {
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
          else cell += char;
        }
        result.push(cell.trim());
        return result;
      });

      // Mapping based on: Year(0), Job#(1), JobName(2), WorkType(3), DealStage(4), Street(5), City(6), State(7), Zip(8), Lat(9), Lon(10), ID(11)
      return rawData.slice(1).map(row => {
        return {
          jobname: row[2],
          worktype: row[3],
          dealstage: row[4],
          street: row[5],
          city: row[6],
          state: row[7],
          zip: row[8],
          latitude: row[9],
          longitude: row[10],
          fulljobid: row[11]
        };
      });
    }

    async function loadData() {
      try {
        const r = await fetch(CSV_URL);
        const text = await r.text();
        projects = parseCSV(text);
      } catch (e) { console.error("CSV loading failed", e); }
    }

    async function init() {
      map = L.map('map').setView([34.5, -119.5], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      cluster = L.markerClusterGroup();
      map.addLayer(cluster);

      await loadData();

      document.getElementById('map').insertAdjacentHTML('beforeend', `<div id="topControls"><button class="btn" id="toggle">⚙️ Filters</button><button class="btn" id="near">📍 Near Me</button><button class="btn" id="dark">🌙 Dark</button></div>`);
      document.querySelector('main').insertAdjacentHTML('beforeend', `
        <section id="filters">
          <div>
            <h3>🔍 Search</h3>
            <input type="text" id="searchBox" placeholder="Search by ID, Name, or City...">
            <div style="margin-top:15px; padding:10px; background:#eef; border-radius:8px;">
               <label><input type="checkbox" id="activeStagesOnly" checked> Show Completed Projects Only</label>
            </div>
          </div>
          <div><h3>Work Type</h3><select id="workTypeSelect" multiple></select></div>
          <div><h3>Deal Stage</h3><select id="dealStageSelect" multiple></select></div>
          <div style="text-align:center"><button id="reset" class="btn">Reset</button><div id="count"></div></div>
          <div id="legend" class="legend"></div>
        </section>`);

      const workTypes = [...new Set(projects.map(p => p.worktype).filter(Boolean))].sort();
      const dealStages = [...new Set(projects.map(p => p.dealstage).filter(Boolean))].sort();
      workTypes.forEach((t, i) => colorMap[t] = COLORS[i % COLORS.length]);

      tomWorkType = new TomSelect('#workTypeSelect', { options: workTypes.map(t => ({value:t, text:t})), plugins:['remove_button'] });
      tomDealStage = new TomSelect('#dealStageSelect', { options: dealStages.map(s => ({value:s, text:s})), plugins:['remove_button'] });

      const legend = document.getElementById('legend');
      Object.entries(colorMap).forEach(([t, c]) => {
        legend.innerHTML += `<div class="legend-item" onclick="tomWorkType.addItem('${t}')"><span class="swatch" style="background:${c}"></span>${t}</div>`;
      });

      document.getElementById('loading').remove();
      
      const update = () => plot();
      document.getElementById('searchBox').addEventListener('input', update);
      document.getElementById('activeStagesOnly').addEventListener('change', update);
      tomWorkType.on('change', update);
      tomDealStage.on('change', update);
      document.getElementById('toggle').onclick = () => document.getElementById('filters').classList.toggle('collapsed');
      document.getElementById('dark').onclick = () => document.body.classList.toggle('dark');
      document.getElementById('near').onclick = () => map.locate({setView:true, maxZoom:12});
      document.getElementById('reset').onclick = () => { location.reload(); };

      plot();
    }

    function plot() {
      cluster.clearLayers();
      const bounds = L.latLngBounds();
      let count = 0;

      const search = (document.getElementById('searchBox').value || '').toLowerCase();
      const activeOnly = document.getElementById('activeStagesOnly').checked;

      projects.forEach(p => {
        if (activeOnly && !TARGET_STAGES.includes(p.dealstage)) return;
        if (tomWorkType.items.length && !tomWorkType.items.includes(p.worktype)) return;
        if (tomDealStage.items.length && !tomDealStage.items.includes(p.dealstage)) return;
        if (search && !Object.values(p).join(' ').toLowerCase().includes(search)) return;

        const lat = parseFloat(p.latitude);
        const lon = parseFloat(p.longitude);
        if (isNaN(lat) || isNaN(lon)) return;

        const iconColor = colorMap[p.worktype] || 'grey';
        const icon = L.icon({
          iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${iconColor}.png`,
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const idValue = p.fulljobid || "N/A";
        const cityStateZip = [p.city, p.state].filter(Boolean).join(', ') + (p.zip ? ` ${p.zip}` : '');

        const popup = `
          <div style="font-family: sans-serif; min-width: 180px;">
            <div style="font-size: 1.3rem; color: #722f37; margin-bottom: 2px;"><strong>${idValue}</strong></div>
            <div style="font-size: 1.0rem; margin-bottom: 10px;"><strong>${p.jobname}</strong></div>
            <div style="border-top: 1px solid #eee; padding-top: 8px; font-size: 0.9rem; line-height:1.4;">
              ${p.street || ''}<br>
              ${cityStateZip}<br><br>
              <b>Type:</b> ${p.worktype}<br>
              <b>Stage:</b> ${p.dealstage}
            </div>
          </div>`;

        const m = L.marker([lat, lon], {icon}).bindPopup(popup);
        m.bindTooltip(`<strong>${idValue}</strong>`, { direction: 'top', offset: [0, -35] });

        cluster.addLayer(m);
        bounds.extend([lat, lon]);
        count++;
      });

      document.getElementById('count').textContent = `${count} Projects Displayed`;
      if (count > 0) map.fitBounds(bounds.pad(0.1));
    }

    window.onload = init;
  </script>
</body>
</html>
