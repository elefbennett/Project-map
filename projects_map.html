<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYV Projects Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

  <!-- TomSelect -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" />

  <style>
    body { margin:0; font-family:'Lato',sans-serif; background:#f9f8f6; padding:20px 0; }
    main { max-width:1400px; margin:0 auto; }
    #map { height:80vh; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.12); position:relative; border:1px solid #e8e2d9; }
    #loadingOverlay { position:absolute; inset:0; background:rgba(255,255,255,0.95); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:1.4rem; }
    .spinner { width:56px; height:56px; border:6px solid #f3f3f3; border-top:6px solid #722f37; border-radius:50%; animation:s 1s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }

    #topControls { position:absolute; top:16px; left:16px; z-index:1000; display:flex; gap:12px; flex-wrap:wrap; }
    .btn { background:rgba(255,255,255,0.95); padding:12px 20px; border:none; border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,0.2); font-weight:600; cursor:pointer; }

    #filters { margin:30px auto; padding:32px; background:white; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.08); border:1px solid #e8e2d9; display:grid; gap:28px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
    #filters h3 { margin:0 0 12px; color:#722f37; font-size:1.5rem; }

    #searchBox { padding:14px 16px; border:1px solid #e8e2d9; border-radius:12px; font-size:1.1rem; width:100%; box-sizing:border-box; }
    .ts-control { padding:14px 16px !important; border:1px solid #e8e2d9 !important; border-radius:12px !important; background:white !important; min-height:56px; font-size:1.1rem; }
    .ts-dropdown { border-radius:12px !important; box-shadow:0 10px 30px rgba(0,0,0,0.12) !important; margin-top:8px; }
    .item { background:#722f37 !important; color:white !important; border-radius:20px !important; padding:6px 12px !important; }

    .legend { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding-top:12px; border-top:1px solid #e8e2d9; }
    .legend-item { display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 12px; border-radius:8px; transition:background .2s; }
    .legend-item:hover { background:#f5f0eb; }
    .legend-item .swatch { width:16px; height:16px; border-radius:50%; border:2px solid #999; }

    #count { text-align:center; font-weight:600; font-size:1.2rem; color:#722f37,color:#722f37; }
  </style>
</head>
<body>
  <main>
    <div id="map">
      <div id="loadingOverlay"><div class="spinner"></div><div>Loading map...</div></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

  <script>
    const COLORS = ['red','blue','green','orange','yellow','violet','grey','black'];
    const colorMap = {};
    let map, cluster, projects = [], tom = null;

    const DATA = [
      {"Job Name":"Napa Valley Estate","Work Type":"Trellis Installation","Street Address":"123 Vineyard Ln","City":"Napa","State":"CA","Latitude":38.5025,"Longitude":-122.4650},
      {"Job Name":"Sonoma Ridge","Work Type":"Irrigation System","Street Address":"456 Oak Rd","City":"Sonoma","State":"CA","Latitude":38.2919,"Longitude":-122.4580},
      {"Job Name":"Santa Ynez Hills","Work Type":"Slope Stabilization - Shear Pins","Street Address":"789 Hill Dr","City":"Santa Ynez","State":"CA","Latitude":34.6100,"Longitude":-120.0800},
      {"Job Name":"Paso Robles Vineyard","Work Type":"Trellis Installation","Street Address":"101 Grape Ave","City":"Paso Robles","State":"CA","Latitude":35.6240,"Longitude":-120.6900}
    ];

    function init() {
      map = L.map('map').setView([36, -119], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
      cluster = L.markerClusterGroup();
      map.addLayer(cluster);

      document.getElementById('map').innerHTML += `
        <div id="topControls">
          <button class="btn" id="toggle">⚙️ Filters</button>
          <button class="btn" id="near">📍 Near Me</button>
          <button class="btn" id="dark">🌙 Dark</button>
        </div>`;

      projects = DATA;

      const types = [...new Set(projects.map(p => p['Work Type']))];
      types.forEach((t,i) => colorMap[t] = COLORS[i % COLORS.length]);

      document.querySelector('main').insertAdjacentHTML('beforeend', `
        <section id="filters">
          <div><h3>🔍 Search</h3><input type="text" id="searchBox" placeholder="Job name, city..."></div>
          <div><h3>Work Type</h3><select id="workTypeSelect" multiple placeholder="All types"></select></div>
          <div style="text-align:center"><button id="reset" class="btn" style="background:#666;color:white">Reset</button><div id="count"></div></div>
          <div id="legend" class="legend"><strong>Legend:</strong></div>
        </section>`);

      tom = new TomSelect('#workTypeSelect', {
        plugins: ['remove_button','dropdown_input'],
        create: false,
        options: types.map(t => ({value: t, text: t})),
        render: {
          option: (d,e) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0"><span style="width:14px;height:14px;border-radius:50%;background:${colorMap[d.value]||'grey'};border:1px solid #999"></span>${e(d.text)}</div>`,
          item: (d,e) => `<div style="background:#722f37;color:white;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${colorMap[d.value]||'grey'}"></span>${e(d.text)}</div>`
        }
      });

      const legend = document.getElementById('legend');
      Object.entries(colorMap).forEach(([t,c]) => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.innerHTML = `<span class="swatch" style="background:${c}"></span>${t}`;
        el.onclick = () => tom.addItem(t);
        legend.appendChild(el);
      });

      document.getElementById('loadingOverlay').remove();
      document.getElementById('count').textContent = `${projects.length} projects loaded`;
      plot();

      const live = () => setTimeout(plot, 300);
      document.getElementById('searchBox').addEventListener('input', live);
      tom.on('change', plot);
      document.getElementById('reset').onclick = () => { document.getElementById('searchBox').value = ''; tom.clear(); plot(); };
      document.getElementById('near').onclick = () => map.locate({setView:true, maxZoom:12});
      document.getElementById('toggle').onclick = () => document.getElementById('filters').classList.toggle('collapsed');
      document.getElementById('dark').onclick = () => document.body.classList.toggle('dark');
    }

    function plot() {
      cluster.clearLayers();
      const bounds = L.latLngBounds();
      let count = 0;
      const q = document.getElementById('searchBox').value.toLowerCase();
      const sel = tom ? tom.items : [];

      for (const p of projects) {
        if (sel.length && !sel.includes(p['Work Type'])) continue;
        if (q && !JSON.stringify(p).toLowerCase().includes(q)) continue;

        const icon = L.icon({
          iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${colorMap[p['Work Type']] || 'grey'}.png`,
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25,41], iconAnchor: [12,41], popupAnchor: [1,-34], shadowSize: [41,41]
        });

        const m = L.marker([p.Latitude, p.Longitude], {icon});
        m.bindPopup(`<strong>${p['Job Name']}</strong><br>${p['Street Address']}, ${p.City}<br><b>Work Type:</b> ${p['Work Type']}`);
        cluster.addLayer(m);
        bounds.extend([p.Latitude, p.Longitude]);
        count++;
      }
      document.getElementById('count').textContent = count ? `${count} project${count>1?'s':''} shown` : 'No results';
      if (count) map.fitBounds(bounds.pad(0.2));
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
